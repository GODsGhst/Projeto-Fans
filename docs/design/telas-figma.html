<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>projetoFans — telas para importar no Figma</title>
<style>
  /* ============================================================
     TOKENS v3 — a identidade da v1 continua inteira: as 12 hues,
     cor+sigla juntas, prova solida contra entrega em contorno.
     O que mudou e a PROFUNDIDADE. A v2 era chapada de proposito e
     por isso lia como documento impresso. Aqui existe uma escada de
     tres superficies e sombra de verdade, entao cartao fica ACIMA
     do fundo em vez de desenhado sobre ele.
     ============================================================ */
  :root {
    /* escada de superficie: fundo rebaixado -> cartao -> flutuante */
    --paper:      #E7EAE5;
    --surface:    #F7F9F6;
    --surface-2:  #FDFEFC;
    --panel:      #F7F9F6;

    --ink:        #14181A;
    --ink-2:      #464E50;
    --ink-3:      #626A6C;
    --rule:       rgba(20, 24, 26, .10);
    --rule-soft:  rgba(20, 24, 26, .05);

    --accent:     #0F766E;
    --accent-ink: #FFFFFF;
    --accent-soft: rgba(15, 118, 110, .12);
    --accent-line: rgba(15, 118, 110, .28);

    --prova-bg:   #14181A;
    --prova-fg:   #EEF0EC;
    --prova-fg-2: rgba(238, 240, 236, .64);
    --grid:       rgba(20, 24, 26, .03);

    /* elevacao — o consertosinho principal da v3 */
    --e1: 0 1px 1.5px rgba(16,20,22,.055), 0 2px 6px -2px rgba(16,20,22,.07);
    --e2: 0 1px 2px rgba(16,20,22,.06), 0 8px 20px -8px rgba(16,20,22,.16);
    --e3: 0 2px 4px rgba(16,20,22,.07), 0 16px 34px -12px rgba(16,20,22,.24);
    --e-fone: 0 2px 6px rgba(0,0,0,.06), 0 40px 80px -40px rgba(0,0,0,.45);
    --pressao: inset 0 1px 2px rgba(16,20,22,.10);

    --r-sm: 8px;
    --r-md: 14px;
    --r-lg: 22px;
    --r-fone: 34px;
    --r-pill: 999px;

    --ui: "Roboto", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "Roboto Mono", ui-monospace, "Cascadia Code", Menlo, Consolas, monospace;

    --mola: cubic-bezier(.22, 1, .36, 1);

    /* 12 hues de materia — contraste >= 4.5:1 com branco, validado */
    --m-calc:  #1D4ED8;
    --m-bd:    #0369A1;
    --m-esoft: #0F766E;
    --m-redes: #15803D;
    --m-so:    #4D7C0F;
    --m-est:   #A16207;
    --m-alg:   #B91C1C;
    --m-mat:   #6D28D9;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-tema="claro"]) {
      --paper: #0C0F11; --surface: #171B1D; --surface-2: #202527; --panel: #171B1D;
      --ink: #E8EBE6; --ink-2: #AEB6B7; --ink-3: #878F91;
      --rule: rgba(232, 235, 230, .12); --rule-soft: rgba(232, 235, 230, .06);
      --accent: #4DBFB3; --accent-ink: #06201D;
      --accent-soft: rgba(77, 191, 179, .16); --accent-line: rgba(77, 191, 179, .34);
      --prova-bg: #E8EBE6; --prova-fg: #14181A; --prova-fg-2: rgba(20, 24, 26, .62);
      --grid: rgba(232, 235, 230, .035);
      --e1: 0 1px 1.5px rgba(0,0,0,.4), 0 2px 6px -2px rgba(0,0,0,.5);
      --e2: 0 1px 2px rgba(0,0,0,.45), 0 8px 20px -8px rgba(0,0,0,.7);
      --e3: 0 2px 4px rgba(0,0,0,.5), 0 16px 34px -12px rgba(0,0,0,.8);
      --e-fone: 0 2px 6px rgba(0,0,0,.5), 0 40px 80px -40px rgba(0,0,0,1);
      --pressao: inset 0 1px 2px rgba(0,0,0,.5);
    }
  }
  :root[data-tema="escuro"] {
    --paper: #0C0F11; --surface: #171B1D; --surface-2: #202527; --panel: #171B1D;
    --ink: #E8EBE6; --ink-2: #AEB6B7; --ink-3: #878F91;
    --rule: rgba(232, 235, 230, .12); --rule-soft: rgba(232, 235, 230, .06);
    --accent: #4DBFB3; --accent-ink: #06201D;
    --accent-soft: rgba(77, 191, 179, .16); --accent-line: rgba(77, 191, 179, .34);
    --prova-bg: #E8EBE6; --prova-fg: #14181A; --prova-fg-2: rgba(20, 24, 26, .62);
    --grid: rgba(232, 235, 230, .035);
    --e1: 0 1px 1.5px rgba(0,0,0,.4), 0 2px 6px -2px rgba(0,0,0,.5);
    --e2: 0 1px 2px rgba(0,0,0,.45), 0 8px 20px -8px rgba(0,0,0,.7);
    --e3: 0 2px 4px rgba(0,0,0,.5), 0 16px 34px -12px rgba(0,0,0,.8);
    --e-fone: 0 2px 6px rgba(0,0,0,.5), 0 40px 80px -40px rgba(0,0,0,1);
    --pressao: inset 0 1px 2px rgba(0,0,0,.5);
  }

  *, *::before, *::after { box-sizing: border-box; }

  body {
    background-color: var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 22px 22px;
    color: var(--ink);
    font-family: var(--ui);
    font-size: 16px;
    line-height: 1.6;
    margin: 0;
    padding: clamp(1.25rem, 4vw, 3rem) clamp(1rem, 4vw, 2rem) 4rem;
    -webkit-font-smoothing: antialiased;
    transition: filter .3s ease;
  }
  body.is-gray { filter: grayscale(1); }

  .wrap { max-width: 1100px; margin-inline: auto; display: flex; flex-direction: column; gap: 2.5rem; }

  h1, h2 { margin: 0; line-height: 1.12; letter-spacing: -.022em; text-wrap: balance; }
  h1 { font-size: clamp(1.9rem, 1.4rem + 2vw, 2.9rem); font-weight: 700; }
  h2 { font-size: clamp(1.35rem, 1.1rem + 1vw, 1.8rem); font-weight: 600; }
  p { margin: 0; }

  .eyebrow {
    font-family: var(--mono); font-size: .75rem; text-transform: uppercase;
    letter-spacing: .11em; color: var(--ink-3);
  }
  .lede { font-size: 1.1rem; color: var(--ink-2); max-width: 64ch; line-height: 1.55; }
  .prose { max-width: 66ch; color: var(--ink-2); display: flex; flex-direction: column; gap: .8rem; }
  .prose strong { color: var(--ink); font-weight: 600; }
  code {
    font-family: var(--mono); font-size: .875em;
    background: var(--rule-soft); padding: .12em .4em; border-radius: var(--r-sm);
  }

  header.top { display: flex; flex-direction: column; gap: 1rem; }

  /* ---------- controles ---------- */
  .barra-ctl {
    display: flex; flex-wrap: wrap; gap: .55rem; align-items: center;
    padding: .8rem .95rem; background: var(--surface);
    border-radius: var(--r-md); box-shadow: var(--e1);
  }
  .barra-ctl p { font-size: .8125rem; color: var(--ink-2); margin-inline-end: auto; }
  button.sw {
    font: inherit; font-size: .8125rem; font-weight: 600;
    display: inline-flex; align-items: center; gap: .5rem;
    padding: .5rem .85rem; border-radius: var(--r-pill); cursor: pointer;
    background: var(--surface-2); color: var(--ink); border: 1px solid var(--rule);
    box-shadow: var(--e1);
    transition: transform .14s var(--mola), box-shadow .14s var(--mola), background .16s ease, color .16s ease;
  }
  button.sw:hover { transform: translateY(-1px); box-shadow: var(--e2); }
  button.sw:active { transform: translateY(0) scale(.97); box-shadow: var(--pressao); }
  button.sw[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.sw:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .ponto { width: .55rem; height: .55rem; border-radius: 50%; border: 1px solid currentColor; }
  button.sw[aria-pressed="true"] .ponto { background: currentColor; }

  /* ============================================================
     APARELHO — 390x844, tamanho real de telefone
     ============================================================ */
  .palco { display: flex; gap: 2rem; flex-wrap: wrap; align-items: flex-start; }

  .fone {
    flex: 0 0 auto;
    width: 390px; height: 844px;
    background: var(--paper);
    border-radius: var(--r-fone);
    box-shadow: var(--e-fone);
    display: flex; flex-direction: column; overflow: hidden;
    position: relative; isolation: isolate;
  }
  @media (max-width: 460px) {
    .fone { width: 100%; height: 760px; }
  }

  .tela { display: none; flex: 1; flex-direction: column; min-height: 0; }
  .tela[data-ativa] { display: flex; animation: entra .34s var(--mola) both; }
  @keyframes entra {
    from { opacity: 0; transform: translateY(10px) scale(.995); }
    to   { opacity: 1; transform: none; }
  }

  /* chrome que flutua sobre o conteudo — e o que separa app de pagina */
  .t-barra {
    display: flex; align-items: center; justify-content: space-between; gap: .75rem;
    padding: 20px 18px 14px; flex: 0 0 auto;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 78%, transparent);
    -webkit-backdrop-filter: blur(14px); backdrop-filter: blur(14px);
    box-shadow: 0 1px 0 var(--rule-soft), var(--e1);
    position: relative; z-index: 3;
  }
  .t-barra h3 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -.02em; }
  .t-barra span {
    font-size: 12.5px; color: var(--ink-3); white-space: nowrap; letter-spacing: -.005em;
  }
  .t-corpo {
    flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin;
    padding: 14px 16px 20px; display: flex; flex-direction: column; gap: 10px;
    position: relative; z-index: 1;
  }

  /* ---------- barra de abas: pilula ativa, icone de verdade ---------- */
  .abas {
    display: grid; grid-template-columns: repeat(4, 1fr);
    padding: 7px 8px 12px; flex: 0 0 auto;
    background: var(--surface);
    background: color-mix(in srgb, var(--surface) 82%, transparent);
    -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px);
    box-shadow: 0 -1px 0 var(--rule-soft), 0 -10px 24px -16px rgba(16,20,22,.3);
    position: relative; z-index: 3;
  }
  .abas button {
    font: inherit; background: none; border: 0; cursor: pointer;
    font-size: 11px; font-weight: 600; letter-spacing: -.004em;
    color: var(--ink-3); display: flex; flex-direction: column; align-items: center; gap: 3px;
    padding: 0; border-radius: var(--r-sm);
    transition: color .18s ease;
    -webkit-tap-highlight-color: transparent;
  }
  .abas button i {
    display: grid; place-items: center;
    width: 46px; height: 28px; border-radius: var(--r-pill);
    transition: background .2s var(--mola), transform .2s var(--mola);
  }
  .abas button i svg { width: 19px; height: 19px; display: block; }
  .abas button:active i { transform: scale(.9); }
  .abas button[aria-current="page"] { color: var(--accent); }
  .abas button[aria-current="page"] i { background: var(--accent-soft); }
  .abas button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  /* ---------- rotulo de grupo: sem regua tipografica de revista ---------- */
  .rotulo {
    font-size: 12.5px; font-weight: 600; letter-spacing: -.005em;
    color: var(--ink-3); display: flex; align-items: center; gap: 7px;
    padding: 6px 2px 0;
  }

  /* ---------- chip de materia: cor + sigla, sempre juntas ---------- */
  .chip {
    display: inline-flex; align-items: center; background: var(--c); color: #fff;
    font-size: 11px; font-weight: 700; letter-spacing: .05em;
    padding: 3px 8px; border-radius: var(--r-pill); white-space: nowrap; text-transform: uppercase;
    box-shadow: 0 1px 2px rgba(16,20,22,.16);
  }

  /* ---------- glifo de tipo: preenchido = prova, vazado = entrega ---------- */
  .glyph { width: 8px; height: 8px; border: 1.5px solid currentColor; display: inline-block; flex: 0 0 auto; }
  .glyph--prova { background: currentColor; border-radius: 1px; }
  .glyph--entrega { border-radius: 50%; }

  /* ---------- superficie base de cartao: e a mudanca de verdade ---------- */
  .aula, .ev--entrega, .campo, .linha-campo, .arquivo, .mini, .dia-aberto, .aviso-mudanca {
    background: var(--surface);
    border: 1px solid var(--rule);
    box-shadow: var(--e1);
  }

  /* ---------- AULA ---------- */
  .aula {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 12px 13px; border-radius: var(--r-md);
    transition: transform .16s var(--mola), box-shadow .16s var(--mola);
  }
  @media (hover: hover) { .aula:hover { transform: translateY(-1px); box-shadow: var(--e2); } }
  .aula:active { transform: scale(.985); box-shadow: var(--e1); }
  .aula--agora {
    background: linear-gradient(180deg, var(--accent-soft), transparent 62%), var(--surface-2);
    border-color: var(--accent-line);
    box-shadow: var(--e2);
    position: relative; overflow: hidden;
  }
  .aula--agora::before {
    content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent);
  }

  .quadro-sala {
    flex: 0 0 auto; width: 48px; height: 48px; border-radius: var(--r-sm);
    background: var(--surface-2); border: 1px solid var(--rule);
    box-shadow: var(--e1);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px;
    color: var(--ink-3);
  }
  .quadro-sala svg { width: 20px; height: 20px; display: block; }
  .quadro-sala b {
    font-family: var(--mono); font-size: 8.5px; font-weight: 500;
    letter-spacing: .04em; color: var(--ink-2);
  }

  .aula-corpo { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .aula-topo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .aula-hora {
    font-family: var(--mono); font-size: 11px; letter-spacing: .02em; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
  }
  .aula-nome { font-size: 15.5px; font-weight: 600; letter-spacing: -.012em; line-height: 1.25; }
  .aula-meta { font-size: 12px; color: var(--ink-3); }
  .aula-atv {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 3px;
    font-size: 11.5px; font-weight: 600; letter-spacing: -.004em; color: var(--ink-2);
  }
  .aula--agora .aula-atv { color: var(--accent); }

  /* ---------- CARD DE EVENTO: peso por tinta, nunca por cor ---------- */
  .ev {
    display: grid; grid-template-columns: 46px minmax(0, 1fr); gap: 14px;
    padding: 13px 14px; border-radius: var(--r-md); align-items: start;
    transition: transform .16s var(--mola), box-shadow .16s var(--mola);
  }
  @media (hover: hover) { .ev:hover { transform: translateY(-1px); box-shadow: var(--e2); } }
  .ev:active { transform: scale(.985); }
  .ev--entrega { color: var(--ink); }
  .ev--prova {
    background: var(--prova-bg); border: 1px solid var(--prova-bg); color: var(--prova-fg);
    box-shadow: var(--e2);
  }
  .ev-data { text-align: center; font-variant-numeric: tabular-nums; }
  .ev-dia { display: block; font-size: 21px; font-weight: 700; line-height: 1; letter-spacing: -.035em; }
  .ev-mes {
    display: block; font-family: var(--mono); font-size: 10px;
    text-transform: uppercase; letter-spacing: .1em; opacity: .62; margin-top: 3px;
  }
  .ev-corpo { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .ev-topo { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ev-tipo {
    font-size: 11.5px; font-weight: 600; letter-spacing: -.004em;
    display: inline-flex; align-items: center; gap: 6px; font-variant-numeric: tabular-nums;
  }
  .ev--entrega .ev-tipo { color: var(--ink-3); }
  .ev--prova .ev-tipo { color: var(--prova-fg-2); }
  .ev-titulo { font-size: 16px; font-weight: 600; line-height: 1.3; letter-spacing: -.014em; }
  .ev--prova .ev-titulo { font-weight: 700; }
  .ev-rodape { font-size: 12.5px; }
  .ev--entrega .ev-rodape { color: var(--ink-3); }
  .ev--prova .ev-rodape { color: var(--prova-fg-2); }

  /* ---------- ANOTACOES: turma e pessoal nunca se confundem ---------- */
  .nota {
    display: flex; flex-direction: column; gap: 4px;
    padding: 10px 13px; border-radius: var(--r-sm);
  }
  .nota-cab {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: -.002em;
  }
  .nota-txt { font-size: 14px; line-height: 1.45; color: var(--ink); }
  .nota-quem { font-size: 11.5px; color: var(--ink-3); }

  /* da turma: regra solida no accent, marcada como visivel a todos */
  .nota--turma {
    border-left: 3px solid var(--accent);
    background: var(--accent-soft);
    box-shadow: var(--e1);
  }
  .nota--turma .nota-cab { color: var(--accent); }

  /* pessoal: regra tracejada, nunca solida — nao e fato compartilhado */
  .nota--pessoal { border-left: 3px dashed var(--ink-3); background: var(--rule-soft); }
  .nota--pessoal .nota-cab { color: var(--ink-3); }
  .nota--pessoal .nota-txt { color: var(--ink-2); }

  /* ---------- CALENDARIO ---------- */
  .cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .cal-hd {
    font-size: 10.5px; font-weight: 600; color: var(--ink-3); text-align: center; padding-bottom: 4px;
  }
  .cal button {
    font: inherit; background: none; border: 0; cursor: pointer;
    aspect-ratio: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 2px; font-size: 12.5px; font-variant-numeric: tabular-nums; color: var(--ink-2);
    border-radius: var(--r-sm); padding: 0;
    transition: background .16s ease, transform .16s var(--mola);
    -webkit-tap-highlight-color: transparent;
  }
  @media (hover: hover) { .cal button:not(:disabled):hover { background: var(--rule-soft); } }
  .cal button:not(:disabled):active { transform: scale(.88); }
  .cal button:disabled { opacity: 0; cursor: default; }
  .cal button.tem-prova { background: var(--prova-bg); color: var(--prova-fg); font-weight: 700; box-shadow: var(--e1); }
  .cal button.tem-entrega { box-shadow: inset 0 0 0 1px var(--rule); }
  .cal button[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .cal .marcas { display: flex; gap: 2px; }
  .cal .marcas u { width: 4px; height: 4px; border-radius: 50%; background: var(--c); display: block; }

  .dia-aberto {
    display: flex; flex-direction: column; gap: 9px;
    padding: 13px 14px; border-radius: var(--r-md);
    animation: entra .3s var(--mola) both;
  }
  .aula-min {
    display: grid; grid-template-columns: 58px 1fr; gap: 10px; align-items: baseline;
    padding: 8px 2px; border-bottom: 1px solid var(--rule-soft);
  }
  .aula-min:last-of-type { border-bottom: 0; }
  .aula-min .h {
    font-family: var(--mono); font-size: 10px; color: var(--ink-3);
    letter-spacing: .04em; font-variant-numeric: tabular-nums;
  }
  .aula-min .c { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .aula-min .l1 { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .aula-min .s { font-size: 12px; color: var(--ink-3); }

  /* ---------- COMPOR ANOTACAO ---------- */
  .seg {
    display: grid; grid-template-columns: 1fr 1fr; gap: 4px;
    background: var(--rule-soft); padding: 4px; border-radius: var(--r-pill);
  }
  .seg button {
    font: inherit; font-size: 12.5px; font-weight: 600; cursor: pointer;
    padding: 9px 8px; border-radius: var(--r-pill); border: 0;
    background: transparent; color: var(--ink-2); text-align: center;
    transition: background .2s var(--mola), color .2s ease, box-shadow .2s var(--mola), transform .14s var(--mola);
    -webkit-tap-highlight-color: transparent;
  }
  .seg button:active { transform: scale(.96); }
  .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); box-shadow: var(--e1); }
  .seg button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .campo {
    border-radius: var(--r-md); padding: 11px 13px;
    min-height: 94px; font-size: 14px; line-height: 1.45; color: var(--ink);
    box-shadow: var(--pressao);
    transition: box-shadow .2s var(--mola), border-color .2s ease;
  }
  .campo:focus { outline: 0; border-color: var(--accent-line); box-shadow: var(--pressao), 0 0 0 3px var(--accent-soft); }
  .campo:empty::before { content: attr(data-vazio); color: var(--ink-3); }

  .linha-campo {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 11px 13px; border-radius: var(--r-md); font-size: 13.5px;
  }
  .linha-campo b { font-weight: 600; }
  .linha-campo span { font-size: 12px; color: var(--ink-3); }

  .alerta {
    display: flex; gap: 8px; align-items: flex-start;
    padding: 10px 12px; border-radius: var(--r-sm); font-size: 12.5px; line-height: 1.42;
    border: 1px dashed var(--rule); color: var(--ink-2); background: var(--rule-soft);
  }
  .alerta[data-tom="turma"] {
    border-style: solid; border-color: var(--accent-line);
    background: var(--accent-soft); color: var(--ink-2);
