# Blueprint do Render para a API e o site do projetoFans.
#
# Com este arquivo no repo, o Render monta o servico sozinho: em
# https://dashboard.render.com/blueprints voce aponta para este repositorio e ele
# le tudo daqui. Nada de configurar campo por campo na interface e torcer para
# lembrar de todos.
#
# O banco NAO esta aqui de proposito. O Postgres gratuito do Render expira em 30
# dias e some com os dados junto — o que, num app que a turma vai usar por um
# semestre, e uma armadilha com data marcada. O Neon nao expira. Ver docs/DEPLOY.md.

services:
  - type: web
    name: projetofans-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    # Ohio, e nao Oregon, para casar com a regiao do Neon. A latencia que importa
    # aqui e API<->banco, nao celular<->API: uma tela sozinha faz varias queries, e
    # atravessar os EUA em cada uma custa mais que os 130ms do Brasil ate a costa
    # leste. Se voce criar o banco em outra regiao, mude esta linha junto.
    region: ohio

    # O Render so considera o deploy saudavel quando esta rota responde 200. Sem
    # ela, ele checa apenas se a porta abriu — e uma aplicacao que subiu e quebrou
    # no Flyway passaria por "no ar".
    healthCheckPath: /api/v1/saude

    # So o backend rebuilda a API. Sem isto, commit de docs, design ou app
    # disparava um build Maven completo (~5 min) e um redeploy com cold start.
    buildFilter:
      paths:
        - backend/**

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: teste

      # generateValue: o Render sorteia um segredo forte e nunca o mostra em log.
      # Melhor que um valor escolhido a mao, que costuma acabar colado num chat.
      - key: JWT_SECRET
        generateValue: true

      # sync: false = "pergunte no painel, nao guarde no git". E a credencial do
      # Neon, e ela nao entra em arquivo versionado em hipotese nenhuma.
      #
      # UMA variavel: o Neon entrega a connection string no formato Java com user e
      # password ja dentro da URL. Um campo para colar em vez de tres, e sem a
      # chance de esquecer o prefixo jdbc:.
      - key: DATABASE_URL
        sync: false

      # De onde a versao web do app pode chamar a API. Origem EXATA do site
      # abaixo, nunca "*". Nao e segredo: e o endereco publico do site.
      - key: CORS_ORIGENS
        value: https://projetofans.onrender.com

      # Recuperacao de senha. O link do e-mail aponta para a tela do site.
      - key: RESET_SENHA_URL_BASE
        value: https://projetofans.onrender.com/senha/reset

      # SMTP do e-mail de reset — preencher no painel, nunca no git. Sem
      # SMTP_HOST o link so vai para o log. Gmail: smtp.gmail.com / 587, usuario
      # = o endereco, senha = "senha de app" (myaccount.google.com/apppasswords).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false

  # A versao web do app: o mesmo build do APK, servido como site. E o caminho
  # de quem tem iPhone (o APK e so Android) e de quem nao quer instalar nada.
  # Site estatico no Render e gratis e NAO hiberna — so a API dorme.
  #
  # Ressalva que a turma precisa saber: o aviso da vespera e notificacao LOCAL
  # do Android (@capacitor/local-notifications). No navegador ele nao existe;
  # o resto do app funciona igual.
  - type: web
    name: projetofans
    runtime: static
    buildCommand: cd app && npm ci && npx ng build
    staticPublishPath: ./app/www
    buildFilter:
      paths:
        - app/**
    # O router do Angular usa caminho de verdade (/calendario, /materias/...).
    # Sem o rewrite, abrir um link direto ou dar F5 fora da raiz da 404.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Angular 20 exige Node 20.19+/22.12+. Fixado para o Render nao escolher.
      - key: NODE_VERSION
        value: "22"
