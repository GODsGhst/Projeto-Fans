services:
  db:
    image: postgres:16
    container_name: projetofans-db
    environment:
      POSTGRES_DB: projetofans
      POSTGRES_USER: projetofans
      POSTGRES_PASSWORD: dev
    # So no loopback: "5432:5432" publica em 0.0.0.0, e com a senha "dev"
    # versionada qualquer maquina do Wi-Fi le e grava o banco (achado A3).
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U projetofans -d projetofans"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
