spring:
  application:
    name: projetofans
  jpa:
    hibernate:
      # O schema e do Flyway, nunca do Hibernate. validate em TODOS os perfis.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    # Erro do proprio Spring MVC (payload invalido, media type errado, rota
    # inexistente) tambem sai em RFC 7807. Sem isto o contrato de erro teria duas
    # formas: ProblemDetail para o dominio e o corpo antigo do Boot para o resto.
    problemdetails:
      enabled: true

app:
  timezone: America/Sao_Paulo
  # Base do link que vai no e-mail de reset. Em dev/test o LogEmailSender so
  # imprime; em prod o SMTP manda.
  reset-senha-url-base: http://localhost:8100/senha/reset
  # Lida pelo reagendador de notificacao (Task 8).
  notificacao-hora-vespera: "19:00"
  # A janela de 14 dias e o teto de 6 itens da Home NAO estao aqui, de proposito.
  # Eles vivem literais no SQL de EventoRepository.home, que e o unico lugar onde
  # as tres regras da Home moram juntas. Estiveram declarados neste bloco ate
  # 2026-08-30 como chaves que nenhum codigo lia: knob que nao gira e pior que
  # knob nenhum, porque quem edita acha que mudou alguma coisa. Para mudar de
  # verdade, mexa na query — e os testes de teto e de janela em HomeServiceTest
  # vao junto.

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.projetofans: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:postgresql://localhost:5432/projetofans
    username: projetofans
    password: dev
  flyway:
    locations: classpath:db/migration
# O seed de dev e o componente SeedDev (@Profile("dev")), nao uma migration:
# usuario de exemplo precisa de hash BCrypt valido, e SQL nao computa hash.
# O perfil test nao o carrega, entao linhas de exemplo nao poluem as assercoes.

app:
  jwt-secret: dev-apenas-nao-use-em-producao-esta-chave-tem-256-bits-de-comprimento
  jwt-expiracao-horas: 720
  google-oauth-client-id: dev-client-id-fake

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    locations: classpath:db/migration

app:
  jwt-secret: test-apenas-chave-de-teste-com-256-bits-de-comprimento-suficiente
  jwt-expiracao-horas: 1
  google-oauth-client-id: test-client-id-fake

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  reset-senha-url-base: ${RESET_SENHA_URL_BASE}
  # sem default: se faltar, a aplicacao NAO sobe. E o comportamento correto.
  jwt-secret: ${JWT_SECRET}
  jwt-expiracao-horas: 720
  google-oauth-client-id: ${GOOGLE_OAUTH_CLIENT_ID}
  fcm-service-account-json: ${FCM_SERVICE_ACCOUNT_JSON}
