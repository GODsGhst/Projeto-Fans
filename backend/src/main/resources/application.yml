spring:
  application:
    name: projetofans
  jpa:
    hibernate:
      # O schema e do Flyway, nunca do Hibernate. validate em TODOS os perfis.
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: America/Sao_Paulo
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: non_null
  mvc:
    # Erro do proprio Spring MVC (payload invalido, media type errado, rota
    # inexistente) tambem sai em RFC 7807. Sem isto o contrato de erro teria duas
    # formas: ProblemDetail para o dominio e o corpo antigo do Boot para o resto.
    problemdetails:
      enabled: true

app:
  timezone: America/Sao_Paulo
  # Base do link que vai no e-mail de reset. Em dev/test o LogEmailSender so
  # imprime; em prod o SMTP manda.
  reset-senha-url-base: http://localhost:8100/senha/reset
  # Lida pelo reagendador de notificacao (Task 8).
  notificacao-hora-vespera: "19:00"
  # A janela de 14 dias e o teto de 6 itens da Home NAO estao aqui, de proposito.
  # Eles vivem literais no SQL de EventoRepository.home, que e o unico lugar onde
  # as tres regras da Home moram juntas. Estiveram declarados neste bloco ate
  # 2026-08-30 como chaves que nenhum codigo lia: knob que nao gira e pior que
  # knob nenhum, porque quem edita acha que mudou alguma coisa. Para mudar de
  # verdade, mexa na query — e os testes de teto e de janela em HomeServiceTest
  # vao junto.

server:
  port: 8080
  error:
    include-message: always

logging:
  level:
    com.projetofans: INFO

---
spring:
  config:
    activate:
      on-profile: dev
  # Sem datasource aqui: o bean BancoDeDesenvolvimento sobe um Postgres 16
  # embutido e persistente, e o autoconfigure do Boot recua diante dele. Duas
  # fontes para a mesma resposta divergem na primeira vez que alguem mexe numa e
  # esquece a outra. Para usar o docker-compose no lugar, apague aquela classe.
  flyway:
    locations: classpath:db/migration
# O seed de dev e o componente SeedDev (@Profile("dev")), nao uma migration:
# usuario de exemplo precisa de hash BCrypt valido, e SQL nao computa hash.
# O perfil test nao o carrega, entao linhas de exemplo nao poluem as assercoes.

app:
  jwt-secret: dev-apenas-nao-use-em-producao-esta-chave-tem-256-bits-de-comprimento
  jwt-expiracao-horas: 720
  google-oauth-client-id: dev-client-id-fake

---
spring:
  config:
    activate:
      on-profile: test
  flyway:
    locations: classpath:db/migration

app:
  jwt-secret: test-apenas-chave-de-teste-com-256-bits-de-comprimento-suficiente
  jwt-expiracao-horas: 1
  google-oauth-client-id: test-client-id-fake

---
# Perfil do ambiente HOSPEDADO de teste (Render + Neon).
#
# Diferenca para prod: aqui NADA que exija conta externa e obrigatorio. E-mail cai
# no LogEmailSender (@Profile("!prod")) e o login por Google entra desligado, com
# mensagem clara. So o Postgres e real, porque sem banco compartilhado o app nao
# testa o que ele e: uma turma vendo a mesma coisa.
#
# Duas variaveis obrigatorias, e so:
#   DATABASE_URL   jdbc:postgresql://HOST/BANCO?sslmode=require
#   JWT_SECRET     >= 256 bits; o Render gera sozinho se voce deixar
spring:
  config:
    activate:
      on-profile: teste
  datasource:
    # UMA variavel, nao tres. O Neon oferece a connection string no formato Java e
    # ela ja vem com user e password como parametros da propria URL:
    #   jdbc:postgresql://HOST/BANCO?user=X&password=Y&sslmode=require
    # Copiar um campo em vez de tres tira duas chances de errar, e tira o erro mais
    # comum de todos — esquecer o prefixo jdbc: — porque o formato Java ja o traz.
    #
    # Quem preferir separado nao fica de fora: SPRING_DATASOURCE_USERNAME e
    # SPRING_DATASOURCE_PASSWORD continuam funcionando por binding relaxado do Boot.
    url: ${DATABASE_URL}
  flyway:
    locations: classpath:db/migration

server:
  # O Render injeta PORT e espera que a aplicacao escute nela. Fixar 8080 aqui
  # faria o deploy subir e o health check nunca responder.
  port: ${PORT:8080}

app:
  jwt-secret: ${JWT_SECRET}
  jwt-expiracao-horas: 720
  # Nao ha login por Google neste ambiente; o valor existe so para o bean construir.
  google-oauth-client-id: desligado-no-ambiente-de-teste
  reset-senha-url-base: ${RESET_SENHA_URL_BASE:https://exemplo.invalid/senha/reset}

logging:
  level:
    com.projetofans: INFO

---
spring:
  config:
    activate:
      on-profile: prod
  datasource:
    url: ${DATABASE_URL}
  flyway:
    locations: classpath:db/migration
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT}
    username: ${SMTP_USER}
    password: ${SMTP_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true

app:
  reset-senha-url-base: ${RESET_SENHA_URL_BASE}
  # sem default: se faltar, a aplicacao NAO sobe. E o comportamento correto.
  jwt-secret: ${JWT_SECRET}
  jwt-expiracao-horas: 720
  google-oauth-client-id: ${GOOGLE_OAUTH_CLIENT_ID}
  fcm-service-account-json: ${FCM_SERVICE_ACCOUNT_JSON}
